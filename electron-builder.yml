appId: app.toolssubsmanager.desktop
productName: Tools & Subs Manager
directories:
  output: release
  buildResources: build
# Desktop output only — dist/web (the PWA build) must not ship in the app.
files:
  - dist/main/**
  - dist/preload/**
  - dist/renderer/**
  - package.json
extraResources:
  - from: build/tray-icon.png
    to: build/tray-icon.png
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: Tools-and-Subs-Manager-Setup-${version}.${ext}
dmg:
  artifactName: Tools-and-Subs-Manager-${version}-${arch}.${ext}
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.productivity
  icon: build/icon.png
