# Security headers. NOTE: nginx `add_header` does NOT inherit into a location
# block once that block declares any add_header of its own — so this snippet is
# `include`d into the server block AND into every location that sets its own
# headers (the cache-control locations below), guaranteeing coverage everywhere.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.frankfurter.dev https://openrouter.ai; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; manifest-src 'self'; worker-src 'self'" always;
