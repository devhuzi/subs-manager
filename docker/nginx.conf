server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Applied to every response that doesn't override add_header (e.g. the SPA
    # fallback location `/` below inherits these).
    include /etc/nginx/security-headers.conf;

    # Service worker + app shell: never cache, so updates ship immediately and
    # the SW can take over on the next visit.
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /manifest.webmanifest {
        include /etc/nginx/security-headers.conf;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Fingerprinted build assets are immutable — cache hard.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: fall back to the shell for client routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
