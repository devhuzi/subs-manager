<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Pinch-zoom stays enabled (accessibility). The iOS focus-zoom on inputs is
      prevented the right way, by 16px input fonts (see ui/input.tsx), not by
      locking the viewport. interactive-widget reflows the keyboard bottom-sheet.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#6366F1" />
    <title>Tools &amp; Subs Manager</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
